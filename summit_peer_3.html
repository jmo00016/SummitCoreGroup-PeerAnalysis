<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Summit Core Group – Peer Analysis</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: #fff; margin: 0; padding: 0; }
.db-wrap { background:#fff; font-family:'DM Sans',sans-serif; color:#1a2744; }
.db-header { background:#1a2744; padding:18px 24px 16px; }
.db-title { font-family:'DM Serif Display',serif; font-size:1.35rem; color:#fff; font-weight:400; }
.db-meta { color:#94a8d0; font-size:0.7rem; margin-top:5px; }
.db-meta span { color:#94a8d0; font-weight:400; }
.db-content { padding:0; }
.metric-section { padding:22px 24px 18px; border-bottom:1px solid #e0e3ee; }
.metric-section:last-child { border-bottom:none; }
.metric-header { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:4px; }
.metric-title { font-family:'DM Serif Display',serif; font-size:1.4rem; color:#1a3a6b; letter-spacing:0.5px; line-height:1.1; text-transform:uppercase; flex:1; }
.metric-sub { color:#2a5cb8; font-size:0.74rem; font-style:italic; line-height:1.45; margin-bottom:14px; }
.chart-area { position:relative; display:flex; flex-direction:column; gap:6px; padding-top:26px; }
.avg-rule { position:absolute; top:0; bottom:0; width:2px; background:#1a2744; opacity:0.45; pointer-events:none; z-index:5; }
.avg-rule-label { position:absolute; top:2px; font-size:0.6rem; font-weight:700; color:#4a5a7a; white-space:nowrap; background:rgba(255,255,255,0.95); padding:1px 5px; border-radius:3px; border:1px solid #c0c4d4; transform:translateX(-50%); pointer-events:none; z-index:6; }
.bar-row { display:flex; align-items:center; gap:8px; border-radius:4px; padding:3px 4px; position:relative; z-index:1; }
.bar-label { width:148px; min-width:148px; font-size:0.71rem; color:#1a2744; text-align:right; line-height:1.3; }
.bar-label.summit-lbl { font-weight:700; color:#c05a1a; }
.bar-track { flex:1; height:20px; background:#e8eaf2; border-radius:3px; position:relative; overflow:hidden; }
.bar-fill { height:100%; border-radius:3px; background:#3b6cb7; }
.bar-fill.summit-fill { background:#e07b39; }
.bar-val { font-size:0.71rem; font-weight:600; color:#1a2744; width:50px; min-width:50px; white-space:nowrap; }
</style>
</head>
<body>
<div class="db-wrap">
  <div class="db-header">
    <div class="db-title">Summit Core Group — Peer Analysis</div>
    <div class="db-meta">As of <span>December 31, 2025</span></div>
  </div>
  <div class="db-content" id="content"></div>
</div>
<script>
var SUMMIT = 'Summit Core Group';
var ALL_COMPANIES = [
  'Alderton Industrial','Cascadia Manufacturing Group','Delverton & Sons',
  'Farwick Corp.','Halloran Systems','Mirex Technologies',
  'Northgate Supplies','Summit Core Group','Westbrook Fabrication'
];
var METRICS = [
  { id:'est-loss', title:'Estimated Loss Rate',
    sub:'Percentage of money owed by customers as of December 31, 2025 management estimates will never be paid',
    fmt:function(v){return v.toFixed(2)+'%';}, avg:3.45, avgLabel:'Peer Average: 3.45%', maxVal:4.75,
    data:{'Alderton Industrial':2.90,'Cascadia Manufacturing Group':3.80,'Delverton & Sons':4.30,'Farwick Corp.':3.10,'Halloran Systems':3.60,'Mirex Technologies':2.60,'Northgate Supplies':4.10,'Summit Core Group':3.50,'Westbrook Fabrication':3.20}
  },
  { id:'revenue', title:'Peer Group by Revenue',
    sub:'Annual revenue (in millions) across peer companies',
    fmt:function(v){return '$'+v+'M';}, avg:null, maxVal:120,
    data:{'Alderton Industrial':72,'Cascadia Manufacturing Group':110,'Delverton & Sons':96,'Farwick Corp.':68,'Halloran Systems':91,'Mirex Technologies':78,'Northgate Supplies':104,'Summit Core Group':85,'Westbrook Fabrication':82}
  },
  { id:'prior-loss', title:'Prior Year Actual Loss Rate',
    sub:'Percentage of money owed by customers in the prior year that was never paid',
    fmt:function(v){return v.toFixed(2)+'%';}, avg:3.23, avgLabel:'Peer Average: 3.23%', maxVal:4.25,
    data:{'Alderton Industrial':2.80,'Cascadia Manufacturing Group':3.50,'Delverton & Sons':3.90,'Farwick Corp.':2.90,'Halloran Systems':3.30,'Mirex Technologies':2.50,'Northgate Supplies':3.80,'Summit Core Group':3.20,'Westbrook Fabrication':3.10}
  },
  { id:'days', title:'Average Days to Collect Payment',
    sub:'Average number of days it takes customers to pay after a purchase',
    fmt:function(v){return v+' days';}, avg:39, avgLabel:'Peer Average: 39 days', maxVal:50,
    data:{'Alderton Industrial':41,'Cascadia Manufacturing Group':35,'Delverton & Sons':44,'Farwick Corp.':37,'Halloran Systems':40,'Mirex Technologies':33,'Northgate Supplies':43,'Summit Core Group':38,'Westbrook Fabrication':36}
  },
  { id:'pastdue', title:'Payments 90+ Days Past Due',
    sub:'Percentage of money owed by customers that is more than 90 days past the due date',
    fmt:function(v){return v.toFixed(2)+'%';}, avg:6.46, avgLabel:'Peer Average: 6.46%', maxVal:9.0,
    data:{'Alderton Industrial':5.80,'Cascadia Manufacturing Group':7.10,'Delverton & Sons':8.00,'Farwick Corp.':5.50,'Halloran Systems':6.50,'Mirex Technologies':5.10,'Northgate Supplies':7.80,'Summit Core Group':6.20,'Westbrook Fabrication':5.90}
  }
];

function avgLeft(m) {
  if (m.avg===null) return null;
  return 'calc(156px + (100% - 214px) * '+(m.avg/m.maxVal*100).toFixed(4)+' / 100)';
}

function renderChart(m) {
  var al = avgLeft(m);
  var h = '<div class="metric-section">'
    + '<div class="metric-header"><div class="metric-title">'+m.title+'</div></div>'
    + '<div class="metric-sub">'+m.sub+'</div>'
    + '<div class="chart-area">'
    + (al?'<div class="avg-rule" style="left:'+al+'"></div><div class="avg-rule-label" style="left:'+al+'">'+m.avgLabel+'</div>':'');
  for (var i=0; i<ALL_COMPANIES.length; i++) {
    var c = ALL_COMPANIES[i]; var s = c===SUMMIT;
    var pct = (m.data[c]/m.maxVal*100).toFixed(1);
    h += '<div class="bar-row">'
      + '<div class="bar-label'+(s?' summit-lbl':'')+'">'+c+'</div>'
      + '<div class="bar-track"><div class="bar-fill'+(s?' summit-fill':'')+'" style="width:'+pct+'%"></div></div>'
      + '<div class="bar-val">'+m.fmt(m.data[c])+'</div></div>';
  }
  return h + '</div></div>';
}

document.addEventListener('DOMContentLoaded', function() {
  var html = '';
  for (var i=0; i<METRICS.length; i++) html += renderChart(METRICS[i]);
  document.getElementById('content').innerHTML = html;
});
</script>
</body>
</html>
